# Server block for the Coolify static (nginx:alpine) deployment.
# Applied through the Coolify API as the application's custom nginx configuration.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml text/plain;

    # Headers declared here are inherited only by locations without their own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Build sources and notes are not part of the public site.
    location ~ ^/(src|tools|\.hallmark|\.git)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(README[^/]*|design\.md)$ { return 404; }
    location ~* \.(md|py)$ { return 404; }

    # Stylesheet and script URLs carry a content hash (?v=), so they can be cached for a year.
    location ~* \.(css|js)$ {
        expires 1y;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(ico|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        expires -1;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
